name: CI
on:
  push:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  # Tier 2 (MVA-205): Playwright against a LOCAL Supabase stack built from supabase/migrations.
  # Runs on pull requests to dev and on demand. Keys come from `supabase status` of the throwaway
  # CI stack and are masked; no repository secrets are used.
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase (applies supabase/migrations in order)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: SQL tests (Tier 1 database tests on the clean local database)
        # psql, not `supabase db query`: the test files are multi-statement scripts.
        # Port 54322 is [db].port in supabase/config.toml. Stops at the first failing file.
        run: |
          set -e
          for f in supabase/tests/*.test.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Export local keys (masked)
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
