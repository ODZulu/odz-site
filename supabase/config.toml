# Local Supabase stack for Tier 2 (MVA-205): `supabase start` builds it from supabase/migrations.
# This is NOT the dev or prod project. The auth settings below are the ones the app assumes
# (they mirror what must be set in the hosted dashboard: docs/DEPLOY.md).
project_id = "odz-site"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
